[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-exposure-pipeline"
version = "0.1.0"
description = "Credit exposure aggregation pipeline with a config-driven data-quality engine and an LLM-assisted, human-reviewed break triage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mayank Sharma" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"exposure_pipeline.dq" = ["rules/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src", "dashboard"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
